name: Configure Cloudflare form

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/cloudflare-form.yml"
      - "migrations/**"
      - "scripts/configure-cloudflare.mjs"

permissions:
  contents: write

concurrency:
  group: cloudflare-form-setup
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify Cloudflare access
        run: npx --yes wrangler@4.124.0 whoami

      - name: Create or locate the leads database
        shell: bash
        run: |
          npx --yes wrangler@4.124.0 d1 list --json > /tmp/d1-list.json
          if ! node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8")); process.exit(rows.some(row=>row.name==="murchip-leads") ? 0 : 1)'; then
            npx --yes wrangler@4.124.0 d1 create murchip-leads --location weur
            npx --yes wrangler@4.124.0 d1 list --json > /tmp/d1-list.json
          fi
          node scripts/configure-cloudflare.mjs /tmp/d1-list.json

      - name: Apply database migrations
        run: npx --yes wrangler@4.124.0 d1 migrations apply LEADS_DB --remote

      - name: Commit the Cloudflare configuration
        shell: bash
        run: |
          if git diff --quiet -- wrangler.jsonc; then
            echo "Cloudflare configuration is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          git commit -m "Configure Cloudflare D1 binding"
          git push origin HEAD:master
